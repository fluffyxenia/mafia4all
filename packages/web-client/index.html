<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mafia For All</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8e8ec;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #connect[hidden] {
        display: none;
      }
      #connect {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        z-index: 20;
      }
      #connect form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(90vw, 480px);
        background: #14161d;
        border: 1px solid #2a2d38;
        border-radius: 10px;
        padding: 24px;
      }
      #connect h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }
      #connect input {
        background: #0b0d12;
        border: 1px solid #2a2d38;
        border-radius: 6px;
        color: inherit;
        padding: 8px 10px;
        font-size: 0.95rem;
      }
      #connect button,
      .panel button {
        background: #3a5cff;
        border: none;
        border-radius: 6px;
        color: white;
        padding: 8px 12px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      #connect button:hover,
      .panel button:hover {
        background: #5470ff;
      }
      #connect .error {
        color: #ff6b6b;
        font-size: 0.85rem;
        min-height: 1em;
      }
      .panel {
        position: fixed;
        z-index: 10;
        background: rgba(20, 22, 29, 0.88);
        border: 1px solid #2a2d38;
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      #hud {
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        font-size: 0.85rem;
        max-width: 340px;
      }
      #hud .role {
        font-weight: 600;
        color: #ffd166;
      }
      #tts-toggle {
        top: 12px;
        left: 364px;
        padding: 8px 12px;
        font-size: 0.82rem;
      }
      #tts-toggle label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      #chat {
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: min(32vw, 380px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      #chat-log .msg {
        margin-bottom: 8px;
      }
      #chat-log .author {
        color: #7fd6ff;
        font-weight: 600;
      }
      #chat-log .system {
        color: #9a9ba5;
        font-style: italic;
      }
      #chat-log .private {
        color: #c9a7ff;
        border-left: 2px solid #6b4fbb;
        padding-left: 8px;
      }
      #actions {
        bottom: 12px;
        left: 12px;
        right: calc(min(32vw, 380px) + 24px);
        padding: 10px 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      #actions select,
      #actions textarea {
        background: #0b0d12;
        border: 1px solid #2a2d38;
        border-radius: 6px;
        color: inherit;
        padding: 6px 8px;
        font-size: 0.85rem;
      }
      #actions textarea {
        flex: 1;
        min-width: 120px;
        max-height: 8em;
        overflow-y: auto;
        resize: none;
        font-family: inherit;
        line-height: 1.35;
      }
      #actions .tool-btn {
        background: #232636;
      }
      #actions .tool-btn.active {
        background: #3a5cff;
      }
      #actions .tool-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex: 1 1 100%;
      }
      #actions .tool-group-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9a9ba5;
        white-space: nowrap;
      }
      #toast {
        position: fixed;
        z-index: 30;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(35, 40, 58, 0.94);
        border: 1px solid #3a5cff;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 0.85rem;
        max-width: min(80vw, 480px);
      }
      #toast.error {
        background: rgba(120, 30, 30, 0.94);
        border-color: #ff6b6b;
      }
      #toast[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>

    <div id="connect">
      <form id="connect-form">
        <h1>Mafia For All</h1>
        <input id="join-url" type="text" placeholder="Paste your join URL (http://.../mcp/&lt;token&gt;)" autocomplete="off" />
        <button type="submit">Connect</button>
        <div class="error" id="connect-error"></div>
      </form>
    </div>

    <div id="hud" class="panel" hidden></div>
    <div id="tts-toggle" class="panel" hidden>
      <label><input id="tts-checkbox" type="checkbox" checked /> Voice (TTS)</label>
    </div>
    <div id="chat" class="panel" hidden>
      <div id="chat-log"></div>
    </div>
    <div id="actions" class="panel" hidden></div>
    <div id="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
